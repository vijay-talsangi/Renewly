{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>{{.Title}} · Renewly</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --bg-accent: #e9f2ef;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --accent-soft: #ecfdf5;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --warning: #92400e;
      --warning-soft: #fffbeb;
      --radius: 18px;
      --shadow: 0 24px 60px -28px rgba(15, 23, 42, 0.28), 0 8px 24px -16px rgba(15, 23, 42, 0.18);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, var(--bg-accent) 0, transparent 34rem),
        radial-gradient(circle at 100% 100%, #eef2ff 0, transparent 30rem),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 18px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: inline-grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 6px 16px -6px rgba(15, 118, 110, 0.65);
    }

    .topbar-note {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .card {
      width: 100%;
      max-width: 470px;
      background: var(--card);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px;
      animation: card-in 260ms ease-out both;
    }

    .card--wide { max-width: 620px; }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      * { scroll-behavior: auto !important; }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 5vw, 30px);
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      letter-spacing: -0.01em;
    }

    .lede {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 15px;
    }

    .muted { color: var(--muted); font-size: 14px; }

    .alert {
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid #fecaca;
      border-radius: 12px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 14px;
      font-weight: 500;
    }

    .field { margin-bottom: 17px; }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .field input::placeholder { color: #94a3b8; }

    .field input:hover { border-color: #b6c2d1; }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.13);
    }

    .password-wrap { position: relative; }

    .password-wrap input { padding-right: 72px; }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      min-width: 56px;
      min-height: 34px;
      padding: 4px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .password-toggle:hover { background: var(--accent-soft); }

    .password-toggle:focus-visible,
    .btn:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(15, 118, 110, 0.35);
      outline-offset: 2px;
    }

    .hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12.5px;
    }

    .field-error {
      margin: 7px 0 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 500;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 50px;
      padding: 12px 18px;
      border: 1px solid transparent;
      border-radius: 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 80ms ease, opacity 140ms ease;
    }

    .btn:active { transform: translateY(1px); }

    .btn:disabled { cursor: progress; opacity: 0.72; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 20px -12px rgba(15, 118, 110, 0.8);
    }

    .btn-primary:hover { background: var(--accent-dark); }

    .btn-secondary {
      background: #fff;
      border-color: var(--line-strong);
      color: var(--ink);
    }

    .btn-secondary:hover { background: #f8fafc; }

    .actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 10px;
      margin-top: 24px;
    }

    .switch {
      margin: 22px 0 0;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .switch a, .text-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .switch a:hover, .text-link:hover { text-decoration: underline; }

    .account-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 22px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f8fafc;
      font-size: 14px;
    }

    .account-label { color: var(--muted); }

    .account-pill {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      padding: 3px 9px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .permissions {
      margin: 0 0 6px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfdfc;
    }

    .scope {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .scope:first-of-type { border-top: 0; padding-top: 4px; }
    .scope:last-child { padding-bottom: 0; }

    .scope-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .scope-name { font-weight: 700; font-size: 15px; }

    .scope-desc {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13.5px;
    }

    .scope-group {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      align-items: start;
      margin-top: 9px;
    }

    .scope-group ul {
      margin: 0;
      padding-left: 18px;
      color: #334155;
      font-size: 14px;
    }

    .scope-group li { margin: 3px 0; }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge--read { background: #e0f2fe; color: #075985; }
    .badge--write { background: var(--warning-soft); color: var(--warning); }

    .security-note {
      margin: 18px 0 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: #115e59;
      font-size: 13px;
    }

    .security-note strong { font-weight: 700; }

    .client-id {
      margin: -12px 0 20px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      overflow-wrap: anywhere;
    }

    .footer {
      max-width: 620px;
      color: #94a3b8;
      font-size: 12.5px;
      text-align: center;
    }

    .status-actions { margin-top: 22px; }

    @media (max-width: 520px) {
      .page { padding: 22px 14px 36px; }
      .topbar-note { display: none; }
      .card { padding: 26px 20px; border-radius: 16px; }
      .actions { grid-template-columns: 1fr; }
      .scope-group { grid-template-columns: 1fr; gap: 5px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Renewly account">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Renewly</span>
      </a>
      <span class="topbar-note">Subscription clarity, without the spreadsheet.</span>
    </header>

    <main class="card{{if .Wide}} card--wide{{end}}" id="main">
      {{template "content" .}}
    </main>

    <footer class="footer">
      Renewly keeps your subscriptions organized and your account secure.
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      document.querySelectorAll("[data-password-toggle]").forEach(function (button) {
        button.addEventListener("click", function () {
          var input = document.getElementById(button.getAttribute("data-password-toggle"));
          if (!input) return;
          var showing = input.type === "text";
          input.type = showing ? "password" : "text";
          button.setAttribute("aria-pressed", showing ? "false" : "true");
          button.textContent = showing ? "Show" : "Hide";
        });
      });

      function checkRegisterPasswords(form) {
        var password = form.querySelector('input[name="password"]');
        var confirm = form.querySelector('input[name="confirm_password"]');
        var confirmError = form.querySelector("#confirm-password-error");
        if (!password || !confirm) return true;

        var mismatch = confirm.value !== "" && password.value !== confirm.value;
        confirm.setCustomValidity(mismatch ? "Passwords do not match." : "");
        if (confirmError) {
          confirmError.hidden = !mismatch;
          confirmError.textContent = mismatch ? "Passwords do not match." : "";
        }
        return !mismatch;
      }

      var registerForm = document.querySelector("form[data-register-form]");
      if (registerForm) {
        ["password", "confirm_password"].forEach(function (name) {
          var input = registerForm.querySelector('input[name="' + name + '"]');
          if (input) {
            input.addEventListener("input", function () {
              checkRegisterPasswords(registerForm);
            });
          }
        });
      }

      document.querySelectorAll("form[data-auth-form]").forEach(function (form) {
        form.addEventListener("submit", function (event) {
          if (form.matches("[data-register-form]") && !checkRegisterPasswords(form)) {
            event.preventDefault();
            var confirm = form.querySelector('input[name="confirm_password"]');
            if (confirm) confirm.focus();
            return;
          }

          var button = event.submitter ||
            form.querySelector('button[type="submit"]:not([formnovalidate])');
          if (!button || button.disabled) return;

          button.dataset.originalText = button.textContent;
          button.textContent = button.getAttribute("data-loading-text") || "Please wait…";

          // Consent decisions are carried by the submit button's name/value.
          // Keep those buttons enabled so the selected decision is submitted.
          if (!button.name) {
            button.disabled = true;
          }
        });
      });
    })();
  </script>
</body>
</html>
{{end}}
