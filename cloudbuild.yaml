steps:
  # 1. Run Go tests
  - name: golang:1.26.4
    entrypoint: go
    args:
      - test
      - ./...

  # 2. Build Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - .

  # 3. Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA

  # 4. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min=0
      - --max=3
      - --timeout=60
      - --set-env-vars=GIN_MODE=release,COOKIE_SECURE=true,DB_POOL_MAX_CONNS=5,DB_POOL_MIN_CONNS=0,EMAIL_FROM=${_EMAIL_FROM},OAUTH_ISSUER=https://renewly-api-255909527631.asia-south1.run.app
      - --set-secrets=DATABASE_URL=renewly-database-url:latest,JWT_SECRET=renewly-jwt-secret:latest,OAUTH_GLOBAL_SECRET=oauth-global-secret:latest

  # 5. Deploy/update the reminder worker Cloud Run Job using the same image
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - renewly-reminder-worker
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --command=/app/reminder-worker
      - --service-account=${_RUNTIME_SA}
      - --tasks=1
      - --parallelism=1
      - --max-retries=0
      - --task-timeout=30m
      - --memory=512Mi
      - --cpu=1
      - --set-env-vars=TZ=Asia/Kolkata,REMINDER_TIMEZONE=Asia/Kolkata,REMINDER_BATCH_SIZE=100,REMINDER_MAX_ATTEMPTS=5,DB_POOL_MAX_CONNS=2,DB_POOL_MIN_CONNS=0,EMAIL_FROM=${_EMAIL_FROM}
      - --set-secrets=DATABASE_URL=renewly-database-url:latest,RESEND_API_KEY=renewly-resend-api-key:latest

substitutions:
  _REGION: asia-south1
  _AR_REPO: renewly-repo
  _SERVICE: renewly-api
  _RUNTIME_SA: renewly-runtime@gen-lang-client-0644475723.iam.gserviceaccount.com
  _EMAIL_FROM: "Renewly Reminders <renewly-reminders@vebit.app>"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
